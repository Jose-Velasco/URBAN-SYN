# Stage 7A: group already-supported experiments without adding another training config format.
# Paths are relative to the repository root, just like individual experiment YAMLs.
study:
  name: hpc_smoke_test
  graph_config: configs/experiments/hpc_smoke_test/nyc_graph.yaml
  experiments:
    pretrain_bpr: configs/experiments/hpc_smoke_test/nyc_link_pretrain.yaml
    joint_scratch: configs/experiments/hpc_smoke_test/nyc_joint.yaml
    # Add frozen and fine-tuned YAMLs here only after Stage 7B supports them.

hpc:
  partition: gpuqs
  gres: gpu:a100:1
  cpus_per_task: 8
  memory: 64G
  time: "01:00:00"
  # Notifications are opt-in; URBAN_SYN_MAIL_USER and URBAN_SYN_MAIL_TYPE
  # always override these settings for one submission.
  mail_type: NONE
