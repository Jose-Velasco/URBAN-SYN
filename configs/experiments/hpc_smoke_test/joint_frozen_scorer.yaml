# Smoke test for loading a frozen pretrained connectivity scorer.
# Connectivity guidance is disabled; this checks checkpoint and model integration.
# Submit through hpc_smoke_test/study.yaml to reuse a matching pretraining run.
experiment:
  name: nyc_joint_frozen_scorer_smoke
  seed: 101

paths:
  graph_config: configs/experiments/hpc_smoke_test/nyc_graph.yaml
  train_sequences: fmm_scripts/outputs/urban_syn_ready/nyc_15s_enriched_moves_train_prepared_road_sequences.parquet
  test_sequences: fmm_scripts/outputs/urban_syn_ready/nyc_15s_enriched_moves_test_prepared_road_sequences.parquet
  trip_id_map: fmm_scripts/data/nyc_15s_fmm_trip_id_map.csv
  road_network: fmm_scripts/data/road_network/nyc.gpkg
  length_distribution: fmm_scripts/outputs/urban_syn_ready/nyc_15s_enriched_moves_train_length_distribution.npy
  output_root: outputs/experiments

model:
  diffusion:
    hidden_dim: 256
    residual_layers: 10
    diffusion_steps: 1000
    beta_start: 0.0001
    beta_end: 0.02
    similarity_chunk_size: 2048
  road_encoder:
    initialization: pretrained
    trainable: false
    checkpoint: null                    # Injected by the Slurm study launcher.
  connectivity_scorer:
    enabled: true
    checkpoint: auto                    # Matching best.pt beside encoder.pt.
    trainable: false                    # Scorer weights stay fixed.
  conditioning:
    enabled: false

training:
  epochs: 1
  batch_size: 8
  max_batches: 2
  grad_clip_norm: 1.0
  optimizer:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.01
  scheduler:
    name: none
  losses:
    noise_mse:
      enabled: true
      weight: 1.0
      include_in_total: true
      every_steps: 1
    reconstruction_mse:
      enabled: true
      weight: 1.0
      include_in_total: true
      every_steps: 1
    hard_connectivity:
      enabled: false
      include_in_total: false
  validation:
    enabled: false
  checkpoint:
    monitor: auto
    save_last: true
    save_best: true
    every_epochs: 1
    resume_from: null

generation:
  enabled: true
  checkpoint_choice: best
  road_layer: roads
  output_name: nyc_frozen_scorer_smoke_generated.parquet
  num_trajectories: 2
  batch_size: 2
  sampler:
    name: ddpm

tracking:
  enabled: true
  provider: mlflow
  storage_scope: job
  experiment_name: urban_syn_scorer_integration_smoke
  tags:
    component: frozen_connectivity_scorer
    purpose: scorer_loading
  logging:
    metrics_every_steps: 1
    gnn_diagnostics_every_steps: 0
    gnn_embedding_enabled: false
    log_system_metrics: true
    log_resolved_config: true
    log_git_info: true

runtime:
  device: cuda
  precision: fp32
  num_workers: 4
