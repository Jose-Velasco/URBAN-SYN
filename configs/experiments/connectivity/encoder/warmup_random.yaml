# @package _global_
# Apply diffusion-to-GNN gradient warmup without encoder pretraining.
model:
  road_encoder:
    mode: joint
    initialization: random
    trainable: true
    checkpoint: null
    gradient_warmup:
      enabled: true
      schedule: normalized_sigmoid
      warmup_steps: 10000
      gamma_min: 0.0
      k: 10.0
      c: 0.8
