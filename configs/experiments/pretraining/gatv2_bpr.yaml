experiment:
  name: nyc_pretrain_gatv2_bpr
  seed: 101
paths:
  graph_config: configs/experiments/graph/nyc_gatv2.yaml
  output_root: outputs/experiments
pretraining:
  graph_split:
    val_fraction: 0.1
    test_fraction: 0.1
    disjoint_train_ratio: 0.2
  positives_per_seed: 1
  negatives:
    strategy: mixed
    amount: 25
    k_hops: 4
    hard_fraction: 0.75
    evaluation_chunk_size: 128
  objective: bpr
  decoder:
    hidden_dim: 128
    num_layers: 3
    activation: relu
    dropout: 0.45
    normalization: layer_norm
training:
  epochs: 500
  batch_size: 256
  max_batches: null
  grad_clip_norm: 1.0
  optimizer:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.01
  scheduler:
    name: reduce_on_plateau
    min_lr: 1.0e-06
    factor: 0.5
    patience: 5
    mode: min
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    eps: 1.0e-08
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001
  checkpoint:
    save_best: true
    save_last: false
    every_epochs: 2000
    resume_from: null
tracking:
  enabled: true
  provider: mlflow
  experiment_name: urban_syn_nyc_full_training
  tracking_uri: null
  storage_scope: shared
  run_name: null
  tags:
    dataset: nyc_15s_enriched_moves
    pipeline: road_link_pretraining
    objective: bpr
    graph: nyc_gatv2
    gnn_architecture: gatv2
  metrics_every_steps: 1000
  logging:
    gnn_diagnostics_every_steps: 2000
    gnn_embedding_enabled: true
    gnn_embedding_every_epochs: 5
    gnn_embedding_sample_size: 512
runtime:
  device: cuda
  precision: fp32
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
