# Existing study name retained for reuse of published pretraining checkpoints.
# Selecting an experiment submits only that experiment, not the entire study.
study:
  name: nyc_full_bce_comparison
  graph_config: configs/experiments/nyc_full_training/nyc_graph.yaml
  experiments:
    pretrain_bpr: configs/experiments/nyc_full_training/link_pretrain_bpr.yaml
    pretrain_bce: configs/experiments/nyc_full_training/link_pretrain_bce.yaml
    joint_scratch: configs/experiments/nyc_full_training/joint_scratch.yaml
    joint_frozen:
      config: configs/experiments/nyc_full_training/joint_frozen.yaml
      pretrained_from: pretrain_bce
    joint_finetune:
      config: configs/experiments/nyc_full_training/joint_finetune.yaml
      pretrained_from: pretrain_bce
    joint_connectivity_baseline: configs/experiments/nyc_full_training/joint_connectivity_baseline.yaml
    joint_connectivity_bce_frozen:
      config: configs/experiments/nyc_full_training/joint_connectivity_bce_frozen.yaml
      pretrained_from: pretrain_bce
    joint_connectivity_bce_gnn_warmup:
      config: configs/experiments/nyc_full_training/joint_connectivity_bce_gnn_warmup.yaml
      pretrained_from: pretrain_bce

hpc:
  partition: gpuqs                                # Medium GPU queue; check current cluster limits.
  gres: gpu:a100:1                                 # One A100 (single-device model).
  cpus_per_task: 8
  memory: 64G
  time: "20:00:00"                              # Initial full-run request; adapt to measured wall time.
  # exclude_nodes: []                               # Add problematic nodes if required, e.g. [cs002].
  # mail_user: ""                                    # Optional; set URBAN_SYN_MAIL_USER in environment instead.
  # mail_type: NONE                                 # Optional notifications: BEGIN,END,FAIL.
