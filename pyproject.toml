[project]
name = "urban-syn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "joblib>=1.6.0",
    "matplotlib>=3.10.9",
    "networkit>=11.2.2",
    "pandas>=3.0.2",
    "pandera[pandas]>=0.31.1",
    "pint>=0.25.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.7.1",
    "torch-geometric>=2.8.1",
    "torchaudio>=2.7.1",
    "torchvision>=0.22.1",
    "tqdm>=4.66.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
# default = true
# default = false

[dependency-groups]
dev = [
    "hypothesis>=6.152.4",
    "pytest>=9.0.3",
]

