# LSTM-TrajGAN wrapper configuration for NYC.
#
# This starts in SMOKE-TEST mode so the wrapper itself can be validated first.
# After that succeeds, switch the marked values to the full-run settings.
#
# Examples:
#   python run_pipeline.py all --config pipeline_configs/nyc.yaml --dry-run
#   python run_pipeline.py all --config pipeline_configs/nyc.yaml
#
# For the full dataset, it is safer to run:
#   python run_pipeline.py prepare --config pipeline_configs/nyc.yaml
# inspect max_length in the builder output/metadata, then:
#   python run_pipeline.py train --config pipeline_configs/nyc.yaml
#   python run_pipeline.py generate --config pipeline_configs/nyc.yaml

dataset:
  name: nyc

paths:
  # Paths inside Docker/Apptainer.
  workspace: /workspace
  repo: /workspace/repo
  data: /workspace/data
  outputs: /workspace/outputs/lstm_trajgan_nyc

  # Read-only upstream MAT dataset input.
  source: /workspace/upstream/data/nyc_output_tabular/output/traj_cleaned.parquet

  # Project-owned adapter.
  builder: /workspace/build_lstm_trajgan_inputs.py

build:
  train_ratio: 0.8
  random_state: 101

  # Preliminary GPS + temporal baseline.
  # Keep the upstream 10-way category branch, but use one constant real token.
  category_mode: constant
  constant_category: 0

  # SMOKE TEST:
  max_trajectories: 100

  # FULL DATASET:
  # max_trajectories: null

encode:
  tid_col: tid

train:
  # SMOKE TEST:
  epochs: 2
  batch_size: 32
  save_params_rate: 1

  # FULL BASELINE:
  # epochs: 2000
  # batch_size: 256
  # save_params_rate: 100

  # null = derive from the train/test CSVs.
  # Use the same value for training and generation.
  max_length: null

generate:
  # null = use train.epochs.
  # This must correspond to an epoch at which a checkpoint is saved.
  checkpoint_epoch: null
