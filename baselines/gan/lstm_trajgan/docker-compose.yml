name: lstm_trajgan
services:
  lstm_trajgan:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      # LSTM-TrajGAN source code.
      # - ./repo:/workspace/repo
      # # Baseline-specific generated/preprocessed inputs.
      # - ./data:/workspace/data
      # # Training checkpoints, generated trajectories, and logs.
      # - ./outputs:/workspace/outputs

      # Read-only MAT-Dataset semantic trajectory source.
      - ../../../data/nyc_output_tabular/output:/workspace/upstream/data/nyc_output_tabular/output:ro
    gpus: all
    shm_size: "8g"
    tty: true
    stdin_open: true
    command: /bin/bash