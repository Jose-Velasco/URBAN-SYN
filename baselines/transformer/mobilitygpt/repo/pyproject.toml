[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilitygpt"
version = "0.1.0"
description = "A GPT-based model for mobility trajectory generation with various finetuning methods"
readme = {text = "MobilityGPT model and NYC workflow package.", content-type = "text/plain"}
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Ammar Haydari", email = "ahaydari@ucdavis.edu"},
]

dependencies = [
    "torch==2.11.0+cu128",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "tqdm==4.70.1",
    "transformers==5.20.2",
    "scipy==1.18.1",
    "opacus==1.6.0",
    "geopandas==1.2.0",
    "geopy==2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]

[tool.setuptools.packages.find]
include = ["mobilitygpt", "finetuners", "datasets", "preprocessing", "nyc_workflow", "nyc_workflow.tests"]
exclude = ["nyc_workflow.output*", "*.venv*", "*.__pycache__*"]

[tool.setuptools.package-data]
nyc_workflow = ["*.md", "requirements.txt", "notebook_provenance.json"]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "nyc_workflow/tests",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/mobilitygpt"
"Bug Tracker" = "https://github.com/yourusername/mobilitygpt/issues"
